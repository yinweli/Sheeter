name: build

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  lint:
    uses: ./.github/workflows/lint.yml

  test:
    uses: ./.github/workflows/test.yml
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  build:
    needs: [lint, test]
    strategy:
      matrix:
        include:
          - artifacts-name: linux-amd64
            goos: linux
            goarch: amd64
            compress-cmd: tar -czf sheeter-linux-amd64.tar.gz -C sheeter .
            compress-file: sheeter-linux-amd64.tar.gz
          - artifacts-name: darwin-amd64
            goos: darwin
            goarch: amd64
            compress-cmd: tar -czf sheeter-darwin-amd64.tar.gz -C sheeter .
            compress-file: sheeter-darwin-amd64.tar.gz
          - artifacts-name: windows-amd64
            goos: windows
            goarch: amd64
            compress-cmd: 7z a -tzip sheeter-windows-amd64.zip sheeter/*
            compress-file: sheeter-windows-amd64.zip
    name: build ${{ matrix.artifacts-name }}
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v6
      - name: extract changelog
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          python3 <<'PYEOF' > release_notes.md
          import os
          import re
          import sys

          version = os.environ['VERSION'].removeprefix('v')
          with open('CHANGELOG.md', encoding='utf-8') as f:
              content = f.read()

          pattern = r'^## \[' + re.escape(version) + r'\][^\n]*\n(.*?)(?=^## \[|\Z)'
          match = re.search(pattern, content, re.MULTILINE | re.DOTALL)
          if not match:
              sys.stderr.write(f'version {version} not found in CHANGELOG.md\n')
              sys.exit(1)
          print(match.group(1).strip())
          PYEOF
      - name: setup go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: build
        shell: bash
        run: |
          mkdir -p sheeter/excel
          env GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -o sheeter/ -ldflags="-s -w" cmd/sheeter/*.go
          cp README.md sheeter/
          cp support/example/config.yaml sheeter/
          cp support/example/build.bat sheeter/
          cp support/example/excel/example.xlsx sheeter/excel/
      - name: compress
        shell: bash
        run: ${{ matrix.compress-cmd }}
      - name: release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.compress-file }}
          body_path: release_notes.md
